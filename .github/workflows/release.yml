name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach the assets for"
        required: true

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm base-devel git github-cli cmake ninja pkgconf qt6-base glib2 glycin hicolor-icon-theme
          sed -i 's/^#en_US.UTF-8/en_US.UTF-8/' /etc/locale.gen && locale-gen
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag against CMakeLists.txt
        run: |
          ver=$(sed -n 's/^project(superfar VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          [ "v$ver" = "$TAG" ] || { echo "CMakeLists.txt says $ver, tag is $TAG: run tools/release.sh" >&2; exit 1; }
          sed -i "s/^pkgver=.*/pkgver=$ver/; s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD
      # makepkg refuses to run as root; the package is built from this
      # checkout, not from a release tarball, so it works while private.
      - name: Build the pacman package and the tarball
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c "git config --global safe.directory '*' && tools/mkpkg.sh && tools/mktarball.sh"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --generate-notes || true
          gh release upload "$TAG" packaging/aur/superfar-*.pkg.tar.zst dist/superfar-*.tar.gz --clobber
