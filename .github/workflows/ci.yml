name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    # The same toolchain and library versions the app is developed on.
    container: archlinux:latest
    env:
      # Natural sort follows the locale; a bare container has none and
      # would sort by byte value.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Install toolchain and dependencies
        run: |
          pacman -Syu --noconfirm gcc cmake ninja pkgconf qt6-base glib2 glycin ttf-dejavu
          sed -i 's/^#en_US.UTF-8/en_US.UTF-8/' /etc/locale.gen && locale-gen
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build
      - name: Tests
        # Headless: core and config tests only need QtCore and GIO. Tests
        # that need a gvfs daemon or a decoder sandbox skip themselves
        # where the container has neither.
        run: ctest --test-dir build --output-on-failure
      - name: Smoke runs
        # Scripted sessions on the offscreen platform: start, mkdir,
        # rename, copy, every overlay, bad arguments; each must exit
        # cleanly and leave the right files behind.
        run: tools/smoke.sh build/src/app/superfar

  packages:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm base-devel git cmake ninja pkgconf qt6-base glib2 glycin hicolor-icon-theme
          sed -i 's/^#en_US.UTF-8/en_US.UTF-8/' /etc/locale.gen && locale-gen
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # makepkg refuses to run as root; the package is built from this
      # checkout, not from a release tarball, so it works without a tag.
      - name: Build package
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c "git config --global safe.directory '*' && tools/mkpkg.sh && tools/mktarball.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: superfar-packages
          path: |
            packaging/aur/superfar-*.pkg.tar.zst
            dist/superfar-*.tar.gz
